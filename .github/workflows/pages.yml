# 每次推送到 main，自动生成页面并发布到 GitHub Pages
name: 发布网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 打包和发布分成两个任务：发布要等打包的产物完全上传好才开始
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
